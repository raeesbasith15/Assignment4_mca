<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="form-card">
    <header>
      <h1>Job Application Form</h1>
      <p>Please fill in the details below to submit your application.</p>
    </header>

    <form action="#" method="post" enctype="multipart/form-data">
      <fieldset>
        <legend>Personal Information</legend>
        <div class="grid">
          <div class="group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your full name" required>
          </div>
          <div class="group">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="18" max="100" placeholder="Enter your age" required>
          </div>
          <div class="group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required>
          </div>
          <div class="group">
            <label for="retype">Retype Password</label>
            <input id="retype" name="retype" type="password" placeholder="Retype password" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Security Information</legend>
        <div class="group">
          <label for="question">Security Question</label>
          <select id="question" name="question" required>
            <option value="">-- Select a question --</option>
            <option>What was the name of your first pet?</option>
            <option>What was the name of your first school?</option>
            <option>In which city were you born?</option>
            <option>What is your favourite teacher's name?</option>
          </select>
        </div>
        <div class="group">
          <label for="answer">Security Answer</label>
          <input id="answer" name="answer" type="text" placeholder="Enter your answer" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contact Information</legend>
        <div class="grid">
          <div class="group">
            <label for="email">Email ID</label>
            <input id="email" name="email" type="email" placeholder="example@email.com" required>
          </div>
          <div class="group">
            <label for="home">Home Phone Number</label>
            <input id="home" name="home" type="tel" placeholder="Home phone number">
          </div>
          <div class="group">
            <label for="office">Office Phone Number</label>
            <input id="office" name="office" type="tel" placeholder="Office phone number">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Languages Known</legend>
        <div class="options">
          <label><input type="checkbox" name="language" value="Malayalam"> Malayalam</label>
          <label><input type="checkbox" name="language" value="English"> English</label>
          <label><input type="checkbox" name="language" value="Hindi"> Hindi</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Application Documents</legend>
        <div class="group">
          <label for="cv">Upload CV</label>
          <input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx" required>
          <small>Accepted formats: PDF, DOC, DOCX</small>
        </div>
      </fieldset>

      <fieldset>
        <legend>Employment Type</legend>
        <div class="options">
          <label><input type="radio" name="employment" value="Full-time" required> Full-time</label>
          <label><input type="radio" name="employment" value="Part-time"> Part-time</label>
          <label><input type="radio" name="employment" value="Internship"> Internship</label>
        </div>
      </fieldset>

      <div class="buttons">
        <button class="submit" type="submit">Submit Application</button>
        <button class="reset" type="reset">Reset Form</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
